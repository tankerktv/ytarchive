[project]
name = "ytarchive"
# Версия — источник истины для тега релиза. CI обязан валить сборку,
# если version здесь и тег vX.Y.Z разошлись.
version = "0.5.0"
description = "Архиватор YouTube-каналов: качает новое в фоне и показывает ход работы"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    # На 3.10 нет tomllib. Единственный настоящий интерпретатор
    # на целевой машине — 3.10, и задание должно работать на нём.
    'tomli>=2 ; python_version < "3.11"',
]

[project.optional-dependencies]
# pyyaml нужен tools/check_ci.py: проверка конфигурации CI запускается
# хуком перед пушем, и без него хук отказывается работать.
dev = ["pytest>=8", "pyyaml>=6"]
# Отдельно от dev намеренно: командная строка и непрерывная выкачка обязаны
# работать без Qt. Ставить сотни мегабайт ради фоновой качалки незачем.
gui = ["PySide6-Essentials>=6.6"]

[tool.setuptools]
# Программа запускается из своей папки и никуда не «устанавливается»:
# `pip install ".[gui]"` нужен только затем, чтобы поставить зависимости.
# Без этой строки он падал на чистой машине: setuptools находил в корне
# четыре пакета и отказывался гадать, какой из них проект.
packages = []

[tool.pytest.ini_options]
testpaths = ["tests"]
# Ядро лежит в корне проекта; без этого тесты его не находят.
pythonpath = ["."]
# Русские имена тестов — осознанно: тест «настоящий случай» должен читаться
# как описание того, что однажды сломалось.
python_functions = ["test_*"]
# Ядро проверяется за доли секунды, и гонять его надо на каждое сохранение.
# Тесты обёртки поднимают настоящие процессы и потому идут секундами:
#   pytest -m "not slow"   быстрый круг по ядру
#   pytest                 всё, как в сборке
markers = ["slow: поднимает настоящие процессы, идёт секундами"]

[tool.ruff]
line-length = 100
# Целимся в 3.10: это единственный настоящий интерпретатор на рабочей машине,
# и правила ruff не должны разрешать то, чего он не поймёт.
target-version = "py310"
